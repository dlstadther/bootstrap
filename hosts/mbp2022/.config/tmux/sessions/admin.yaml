name: admin
root: ~
windows:
  - agentsview: agentsview update --yes && agentsview serve --no-browser
  - kenn-forge:
      root: ~/code/kenn-forge
      panes:
        - git fetch --tags && git checkout $(git tag --sort=-v:refname | head -n1) && mise install && make build && make install && ./kenn-forge serve
